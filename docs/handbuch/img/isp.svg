<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" font-family="DejaVu Sans, sans-serif">
  <rect width="940" height="430" fill="#f8fafc"/>
  <text x="470" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#155e75">USBasp an J2 anschließen (ISP-Programmierung)</text>
  <!-- Warnbox -->
  <rect x="120" y="48" width="700" height="46" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="470" y="68" text-anchor="middle" font-size="13" font-weight="bold" fill="#b91c1c">⚠ USBasp-Jumper zwingend auf 3,3 V stellen!</text>
  <text x="470" y="86" text-anchor="middle" font-size="11.5" fill="#991b1b">Mit 5 V stirbt das Funkmodul — der CC1101 verträgt höchstens 3,6 V.</text>
  <!-- J2 auf der Platine -->
  <text x="235" y="130" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#334155">J2 auf der Platine (Draufsicht)</text>
  <rect x="150" y="145" width="170" height="120" rx="10" fill="#0e7490" opacity="0.08" stroke="#0e7490" stroke-width="2"/>
  <!-- Pins: 2 Spalten x 3 Reihen; ungerade links -->
  <g font-size="12">
    <rect x="175" y="160" width="26" height="26" rx="4" fill="#f59e0b"/><text x="188" y="178" text-anchor="middle" font-weight="bold">1</text>
    <rect x="269" y="160" width="26" height="26" rx="4" fill="#e2e8f0" stroke="#94a3b8"/><text x="282" y="178" text-anchor="middle">2</text>
    <rect x="175" y="197" width="26" height="26" rx="4" fill="#e2e8f0" stroke="#94a3b8"/><text x="188" y="215" text-anchor="middle">3</text>
    <rect x="269" y="197" width="26" height="26" rx="4" fill="#e2e8f0" stroke="#94a3b8"/><text x="282" y="215" text-anchor="middle">4</text>
    <rect x="175" y="234" width="26" height="26" rx="4" fill="#e2e8f0" stroke="#94a3b8"/><text x="188" y="252" text-anchor="middle">5</text>
    <rect x="269" y="234" width="26" height="26" rx="4" fill="#e2e8f0" stroke="#94a3b8"/><text x="282" y="252" text-anchor="middle">6</text>
  </g>
  <g font-size="11.5" fill="#334155">
    <text x="165" y="178" text-anchor="end">MISO</text>
    <text x="305" y="178" text-anchor="start">3V3</text>
    <text x="165" y="215" text-anchor="end">SCK</text>
    <text x="305" y="215" text-anchor="start">MOSI</text>
    <text x="165" y="252" text-anchor="end">RESET</text>
    <text x="305" y="252" text-anchor="start">GND</text>
  </g>
  <text x="188" y="290" text-anchor="middle" font-size="10.5" fill="#b45309">Pin 1 = eckiges Pad</text>
  <!-- Verbindungslinien-Tabelle -->
  <g font-size="12.5" fill="#334155">
    <text x="470" y="150" text-anchor="middle" font-weight="bold" fill="#155e75">6 Leitungen</text>
    <line x1="365" y1="173" x2="575" y2="173" stroke="#0e7490" stroke-width="2"/>
    <line x1="365" y1="210" x2="575" y2="210" stroke="#0e7490" stroke-width="2"/>
    <line x1="365" y1="247" x2="575" y2="247" stroke="#0e7490" stroke-width="2"/>
    <text x="470" y="168" text-anchor="middle" font-size="10.5" fill="#64748b">MISO → 9 · 3V3 → 2 · SCK → 7</text>
    <text x="470" y="205" text-anchor="middle" font-size="10.5" fill="#64748b">MOSI → 1 · RESET → 5</text>
    <text x="470" y="242" text-anchor="middle" font-size="10.5" fill="#64748b">GND → 4/6/8/10 (einer reicht)</text>
  </g>
  <!-- USBasp 10-pol -->
  <text x="710" y="130" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#334155">USBasp-Stecker (10-polig, Blick auf die Buchse)</text>
  <rect x="600" y="145" width="220" height="120" rx="10" fill="#7c3aed" opacity="0.08" stroke="#7c3aed" stroke-width="2"/>
  <g font-size="11.5">
    <rect x="622" y="163" width="24" height="24" rx="4" fill="#f59e0b"/><text x="634" y="180" text-anchor="middle" font-weight="bold">1</text>
    <rect x="660" y="163" width="24" height="24" rx="4" fill="#e2e8f0" stroke="#94a3b8"/><text x="672" y="180" text-anchor="middle">3</text>
    <rect x="698" y="163" width="24" height="24" rx="4" fill="#e2e8f0" stroke="#94a3b8"/><text x="710" y="180" text-anchor="middle">5</text>
    <rect x="736" y="163" width="24" height="24" rx="4" fill="#e2e8f0" stroke="#94a3b8"/><text x="748" y="180" text-anchor="middle">7</text>
    <rect x="774" y="163" width="24" height="24" rx="4" fill="#e2e8f0" stroke="#94a3b8"/><text x="786" y="180" text-anchor="middle">9</text>
    <rect x="622" y="223" width="24" height="24" rx="4" fill="#e2e8f0" stroke="#94a3b8"/><text x="634" y="240" text-anchor="middle">2</text>
    <rect x="660" y="223" width="24" height="24" rx="4" fill="#e2e8f0" stroke="#94a3b8"/><text x="672" y="240" text-anchor="middle">4</text>
    <rect x="698" y="223" width="24" height="24" rx="4" fill="#e2e8f0" stroke="#94a3b8"/><text x="710" y="240" text-anchor="middle">6</text>
    <rect x="736" y="223" width="24" height="24" rx="4" fill="#e2e8f0" stroke="#94a3b8"/><text x="748" y="240" text-anchor="middle">8</text>
    <rect x="774" y="223" width="24" height="24" rx="4" fill="#e2e8f0" stroke="#94a3b8"/><text x="786" y="240" text-anchor="middle">10</text>
  </g>
  <g font-size="10" fill="#475569">
    <text x="634" y="158" text-anchor="middle">MOSI</text>
    <text x="672" y="158" text-anchor="middle">NC</text>
    <text x="710" y="158" text-anchor="middle">RESET</text>
    <text x="748" y="158" text-anchor="middle">SCK</text>
    <text x="786" y="158" text-anchor="middle">MISO</text>
    <text x="634" y="262" text-anchor="middle">VCC</text>
    <text x="672" y="262" text-anchor="middle">GND</text>
    <text x="710" y="262" text-anchor="middle">GND</text>
    <text x="748" y="262" text-anchor="middle">GND</text>
    <text x="786" y="262" text-anchor="middle">GND</text>
  </g>
  <!-- Zuordnungstabelle -->
  <g font-size="12.5">
    <rect x="150" y="310" width="640" height="100" rx="10" fill="#f0fdfa" stroke="#0e7490"/>
    <text x="470" y="333" text-anchor="middle" font-weight="bold" fill="#155e75">Kabelzuordnung J2 → USBasp</text>
    <text x="180" y="360" fill="#334155">J2-1 MISO → USBasp-9</text>
    <text x="400" y="360" fill="#334155">J2-2 3V3 → USBasp-2 (VCC)</text>
    <text x="655" y="360" fill="#334155">J2-3 SCK → USBasp-7</text>
    <text x="180" y="388" fill="#334155">J2-4 MOSI → USBasp-1</text>
    <text x="400" y="388" fill="#334155">J2-5 RESET → USBasp-5</text>
    <text x="655" y="388" fill="#334155">J2-6 GND → USBasp-4</text>
  </g>
</svg>
