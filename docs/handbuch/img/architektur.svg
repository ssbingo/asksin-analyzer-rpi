<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" font-family="DejaVu Sans, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="940" height="330" fill="#f8fafc"/>
  <!-- Homematic-Geräte -->
  <rect x="20" y="90" width="150" height="150" rx="12" fill="#ecfdf5" stroke="#15803d" stroke-width="2"/>
  <text x="95" y="120" text-anchor="middle" font-size="15" font-weight="bold" fill="#14532d">Homematic-</text>
  <text x="95" y="140" text-anchor="middle" font-size="15" font-weight="bold" fill="#14532d">Geräte</text>
  <text x="95" y="168" text-anchor="middle" font-size="12" fill="#166534">Heizung · Fenster</text>
  <text x="95" y="186" text-anchor="middle" font-size="12" fill="#166534">Schalter · Sensoren</text>
  <text x="95" y="214" text-anchor="middle" font-size="12" fill="#166534">senden BidCoS-</text>
  <text x="95" y="230" text-anchor="middle" font-size="12" fill="#166534">Telegramme</text>
  <!-- Funkwellen -->
  <path d="M185 150 q14 15 0 30" stroke="#15803d" stroke-width="2.5" fill="none"/>
  <path d="M197 140 q22 25 0 50" stroke="#15803d" stroke-width="2.5" fill="none" opacity="0.7"/>
  <path d="M209 130 q30 35 0 70" stroke="#15803d" stroke-width="2.5" fill="none" opacity="0.4"/>
  <text x="200" y="215" text-anchor="middle" font-size="12" fill="#166534">868 MHz</text>
  <!-- Platine -->
  <rect x="245" y="60" width="215" height="210" rx="12" fill="#f0fdfa" stroke="#0e7490" stroke-width="2.5"/>
  <text x="352" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#155e75">Analyzer-Platine</text>
  <rect x="265" y="105" width="80" height="64" rx="8" fill="#0e7490"/>
  <text x="305" y="132" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">CC1101</text>
  <text x="305" y="150" text-anchor="middle" font-size="10" fill="#cffafe">Funkempfänger</text>
  <rect x="360" y="105" width="80" height="64" rx="8" fill="#155e75"/>
  <text x="400" y="128" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">ATmega</text>
  <text x="400" y="143" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">328P</text>
  <text x="400" y="159" text-anchor="middle" font-size="9.5" fill="#cffafe">dekodiert live</text>
  <line x1="345" y1="137" x2="360" y2="137" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <text x="352" y="196" text-anchor="middle" font-size="11.5" fill="#334155">Jedes Telegramm wird als</text>
  <text x="352" y="212" text-anchor="middle" font-size="11.5" fill="#334155">Textzeile ausgegeben:</text>
  <text x="352" y="234" text-anchor="middle" font-size="12" font-family="monospace" fill="#0e7490">:5A0E0100701A2B…;</text>
  <!-- UART-Pfeil -->
  <line x1="460" y1="165" x2="535" y2="165" stroke="#475569" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="497" y="150" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">UART</text>
  <text x="497" y="185" text-anchor="middle" font-size="11" fill="#64748b">58 824 Baud</text>
  <!-- Raspberry Pi -->
  <rect x="540" y="60" width="230" height="210" rx="12" fill="#fef2f2" stroke="#be123c" stroke-width="2.5"/>
  <text x="655" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#9f1239">Raspberry Pi 4</text>
  <rect x="560" y="103" width="190" height="40" rx="8" fill="#be123c"/>
  <text x="655" y="128" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">Core-Dienst (Node.js)</text>
  <rect x="560" y="152" width="90" height="40" rx="8" fill="#e11d48" opacity="0.85"/>
  <text x="605" y="177" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff">SQLite</text>
  <rect x="660" y="152" width="90" height="40" rx="8" fill="#e11d48" opacity="0.85"/>
  <text x="705" y="171" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff">Web-UI</text>
  <text x="705" y="185" text-anchor="middle" font-size="9.5" fill="#ffe4e6">REST · WebSocket</text>
  <text x="655" y="222" text-anchor="middle" font-size="11.5" fill="#334155">Duty-Cycle · RSSI · Raten</text>
  <text x="655" y="240" text-anchor="middle" font-size="11.5" fill="#334155">Versorgung über PoE-HAT</text>
  <!-- LAN-Pfeil -->
  <line x1="770" y1="165" x2="835" y2="165" stroke="#475569" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="800" y="150" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">LAN</text>
  <!-- Anzeige -->
  <rect x="840" y="90" width="85" height="150" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="882" y="122" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">Browser</text>
  <line x1="852" y1="140" x2="913" y2="140" stroke="#f59e0b"/>
  <text x="882" y="168" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">ioBroker</text>
  <text x="882" y="192" text-anchor="middle" font-size="10.5" fill="#a16207">Adapter,</text>
  <text x="882" y="207" text-anchor="middle" font-size="10.5" fill="#a16207">geplant</text>
</svg>
