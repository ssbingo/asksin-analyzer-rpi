<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 380" font-family="DejaVu Sans, sans-serif">
  <rect width="940" height="380" fill="#f8fafc"/>
  <text x="470" y="34" text-anchor="middle" font-size="16" font-weight="bold" fill="#155e75">Der Stapel von der Seite — im Datenschrank montiert</text>
  <!-- Grundplatte -->
  <rect x="60" y="320" width="820" height="14" fill="#94a3b8"/>
  <text x="470" y="356" text-anchor="middle" font-size="12" fill="#475569">Montageplatte im Schrank</text>
  <!-- Abstandsbolzen -->
  <rect x="120" y="270" width="10" height="50" fill="#cbd5e1" stroke="#94a3b8"/>
  <rect x="410" y="270" width="10" height="50" fill="#cbd5e1" stroke="#94a3b8"/>
  <rect x="620" y="230" width="10" height="90" fill="#cbd5e1" stroke="#94a3b8"/>
  <rect x="840" y="230" width="10" height="90" fill="#cbd5e1" stroke="#94a3b8"/>
  <!-- Pi 4 -->
  <rect x="90" y="250" width="360" height="20" rx="4" fill="#15803d"/>
  <text x="270" y="265" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#ffffff">Raspberry Pi 4</text>
  <!-- Header Pi -->
  <rect x="110" y="236" width="150" height="14" fill="#1e293b"/>
  <!-- PoE-HAT -->
  <rect x="90" y="176" width="360" height="18" rx="4" fill="#1d4ed8"/>
  <text x="238" y="190" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#ffffff">PoE-HAT (Waveshare B)</text>
  <rect x="110" y="194" width="150" height="42" fill="#1e293b"/>
  <text x="185" y="219" text-anchor="middle" font-size="10" fill="#e2e8f0">Stapelheader</text>
  <!-- Lüfter -->
  <circle cx="360" cy="160" r="26" fill="none" stroke="#1d4ed8" stroke-width="3"/>
  <path d="M360 140 a20 20 0 0 1 18 12 M360 180 a20 20 0 0 1 -18 -12" stroke="#1d4ed8" stroke-width="3" fill="none"/>
  <text x="360" y="122" text-anchor="middle" font-size="11.5" fill="#1d4ed8" font-weight="bold">Lüfter bleibt frei!</text>
  <!-- Durchgesteckter Header oben -->
  <rect x="110" y="150" width="150" height="26" fill="#334155"/>
  <!-- Analyzer: Arm + Körper -->
  <rect x="96" y="132" width="500" height="16" rx="3" fill="#0e7490"/>
  <rect x="560" y="132" width="330" height="16" rx="3" fill="#0e7490"/>
  <rect x="560" y="148" width="330" height="72" fill="#a7f3d022" stroke="none"/>
  <text x="330" y="118" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#155e75">Analyzer-Platine: Arm über dem Header …</text>
  <text x="725" y="118" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#155e75">… Körper daneben</text>
  <!-- Funkmodul auf Körper -->
  <rect x="700" y="112" width="90" height="20" rx="3" fill="#155e75"/>
  <text x="745" y="107" text-anchor="middle" font-size="11" fill="#155e75">Funkmodul E07</text>
  <!-- Antennenkabel -->
  <path d="M790 122 C 850 122, 880 90, 905 60" stroke="#d97706" stroke-width="3.5" fill="none"/>
  <circle cx="905" cy="52" r="7" fill="#d97706"/>
  <rect x="899" y="18" width="12" height="30" rx="2" fill="#92400e"/>
  <text x="860" y="40" text-anchor="end" font-size="11.5" fill="#92400e" font-weight="bold">Antenne außen</text>
  <text x="860" y="55" text-anchor="end" font-size="10.5" fill="#a16207">IPEX-Kabel → SMA-Buchse</text>
  <!-- Stützbolzen-Hinweis -->
  <text x="735" y="250" text-anchor="middle" font-size="11" fill="#475569">MH3/MH4 stützen den</text>
  <text x="735" y="265" text-anchor="middle" font-size="11" fill="#475569">auskragenden Körper</text>
  <!-- JST-Kabel -->
  <path d="M580 148 q-30 40 -60 55" stroke="#7c3aed" stroke-width="3" fill="none"/>
  <text x="520" y="228" text-anchor="middle" font-size="11" fill="#6d28d9">JST-Kabel zu</text>
  <text x="520" y="243" text-anchor="middle" font-size="11" fill="#6d28d9">OLED · Taster · LED</text>
</svg>
