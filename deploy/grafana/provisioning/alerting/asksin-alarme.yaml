# Vier fertige Alarme für den AskSin-Analyzer.
#
# Diese vier sind der Grund, warum die Langzeitdaten überhaupt lohnen: Sie
# melden sich, ohne dass jemand ein Dashboard offen hat.
#
#   1. Analyzer offline      — der Sniffer liefert keine gültigen Daten mehr
#   2. Duty-Cycle zu hoch    — ein Gerät stopft das Funknetz zu
#   3. Gerät verstummt       — vermutlich leere Batterie
#   4. Grundrauschen hoch    — ein Störer ist aktiv
#
# Wohin die Meldungen gehen, steht bewusst NICHT hier. Grafana schickt sie an
# den vorgegebenen Kontaktpunkt; wer E-Mail, Telegram oder ioBroker möchte,
# richtet das einmalig unter Alerting → Contact points ein. Diese Datei
# vorzubelegen hiesse, Zugangsdaten ins Repo zu schreiben.
#
# Zu "DatasourceError": Scheitert die ABFRAGE selbst (Datenbank weg, Token
# falsch, kein auswertbares Ergebnis), meldet Grafana das als eigenen Alarm mit
# der Kennung DatasourceError — mit den Annotationen der Regel, aber OHNE
# Daten. Es gibt dann keinen Standort, kein Geraet, keine Zahl.
#
# Genau das hat am 19./20.08.2026 zu einer Meldung gefuehrt, aus der niemand
# ablesen konnte, WELCHER der drei Analyzer betroffen ist. Die richtige
# Antwort war: keiner. Deshalb sagt jede summary das jetzt ausdruecklich,
# sobald das Etikett `rulename` gesetzt ist — Grafana setzt es nur bei genau
# diesen Fehlalarmen. Ein Text, der offenlaesst, ob eine Anlage ausgefallen
# ist oder eine Abfrage, ist schlimmer als gar keiner.
#
# Wiederholt wird eine stehende Meldung uebrigens alle 12 Stunden
# (repeat_interval der Benachrichtigungsregel) — zwei Meldungen im Abstand von
# genau zwoelf Stunden sind deshalb EIN Zustand und nicht zwei Ereignisse.
#
# Jede Regel folgt demselben Aufbau:
#
#   A  holt die Messwerte (Flux)
#   B  verdichtet sie auf eine Zahl je Reihe (reduce)
#   C  vergleicht diese Zahl mit der Schwelle (threshold) — das ist die
#      Bedingung, die den Alarm auslöst

apiVersion: 1

groups:
  - orgId: 1
    name: AskSin-Analyzer
    folder: AskSin-Analyzer
    interval: 5m
    rules:

      # ------------------------------------------------------ 1. offline
      - uid: asksin-alarm-offline
        title: Analyzer offline
        condition: C
        for: 10m
        # NoData bedeutet hier: Es kommen gar keine Messwerte mehr an. Das ist
        # KEIN "alles in Ordnung", sondern der schwerere Fall — der Analyzer
        # schreibt nicht einmal mehr. Deshalb loest auch das aus.
        noDataState: Alerting
        # Bleibt Error: Dieser Waechter soll auch dann anschlagen, wenn die
        # Datenbank selbst nicht mehr antwortet — dann stimmt erst recht
        # etwas nicht. Die zehn Minuten unter 'for' fangen kurze Aussetzer.
        execErrState: Error
        annotations:
          # Der Regelname steht als KLARTEXT voran, nicht als Platzhalter.
          # Scheitert die Abfrage selbst, hat Grafana keine Etiketten — dann
          # faellt jeder Platzhalter auf "[no value]" zurueck und die Meldung
          # sagt gar nichts mehr. Der Standort kommt nur dazu, wenn es ihn gibt.
          summary: >-
            {{ if $labels.rulename }}ABFRAGE FEHLGESCHLAGEN in der Regel „{{ $labels.rulename }}" — kein Analyzer ist ausgefallen, Grafana konnte die Datenbank nicht auswerten.{{ else }}Analyzer offline{{ if $labels.standort }} — {{ $labels.standort }}{{ end }}{{ end }}
          description: >-
            Der Analyzer am Standort {{ $labels.standort }} meldet seit über
            zehn Minuten keine gültige Verbindung zum Funkmodul. Prüfen:
            Steckt die Platine, läuft der Dienst, ist die Baudrate 58824?
        labels:
          bereich: analyzer
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: asksin-influx
            model:
              refId: A
              query: |
                from(bucket: "asksin")
                  |> range(start: -15m)
                  |> filter(fn: (r) => r._measurement == "analyzer")
                  |> filter(fn: (r) => r._field == "connected")
                  |> group(columns: ["standort"])
                  |> last()
                  |> map(fn: (r) => ({ r with _value: if r._value then 1.0 else 0.0 }))
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: lt, params: [1] }

      # --------------------------------------------------- 2. Duty-Cycle
      - uid: asksin-alarm-dutycycle
        title: Duty-Cycle über 80 Prozent
        condition: C
        for: 15m
        # Hier KEIN Alarm bei fehlenden Daten: Dass gerade kein Geraet ueber
        # der Schwelle liegt, ist der Normalfall und liefert eine leere Reihe.
        noDataState: OK
        # KeepLast statt Error: Eine kurzzeitig gescheiterte Abfrage — etwa
        # waehrend Grafana neu startet — ist kein Grund fuer eine Meldung
        # aufs Telefon. Genau das ist passiert: Nach einem Neustart kamen
        # drei 'DatasourceError' an, obwohl gar nichts los war. Bleibt die
        # Abfrage dauerhaft kaputt, faellt es hier trotzdem auf, weil die
        # Regel in Grafana rot steht — und weil ohne Daten der Waechter
        # 'Analyzer offline' anschlaegt.
        execErrState: KeepLast
        annotations:
          summary: >-
            {{ if $labels.rulename }}ABFRAGE FEHLGESCHLAGEN in der Regel „{{ $labels.rulename }}" — kein Analyzer ist ausgefallen, Grafana konnte die Datenbank nicht auswerten.{{ else }}Duty-Cycle über 80 %{{ if $labels.name }} — {{ $labels.name }}{{ end }}{{ end }}
          description: >-
            Das Gerät {{ $labels.name }} liegt seit einer Viertelstunde über
            80 % Sendezeit. Ein einziges defektes Gerät kann das ganze
            Funknetz blockieren — bei 100 % darf es per Gesetz nicht mehr
            senden. Batterie prüfen oder Gerät vom Netz nehmen.
        labels:
          bereich: funk
        data:
          - refId: A
            relativeTimeRange: { from: 1800, to: 0 }
            datasourceUid: asksin-influx
            model:
              refId: A
              query: |
                from(bucket: "asksin")
                  |> range(start: -30m)
                  |> filter(fn: (r) => r._measurement == "geraet")
                  |> filter(fn: (r) => r._field == "dutyCycle")
                  |> group(columns: ["name"])
                  |> max()
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [80] }

      # ------------------------------------------------ 3. Gerät stumm
      - uid: asksin-alarm-stumm
        title: Gerät seit 24 Stunden stumm
        condition: C
        # Zehn Minuten statt sofort: Eine einzelne Auswertung genuegte bisher,
        # um zu melden. Ein Geraet, das seit 24 Stunden schweigt, schweigt auch
        # zehn Minuten spaeter noch — Eile bringt hier nichts ausser Fehlalarmen.
        for: 10m
        noDataState: OK
        # KeepLast statt Error: Eine kurzzeitig gescheiterte Abfrage — etwa
        # waehrend Grafana neu startet — ist kein Grund fuer eine Meldung
        # aufs Telefon. Genau das ist passiert: Nach einem Neustart kamen
        # drei 'DatasourceError' an, obwohl gar nichts los war. Bleibt die
        # Abfrage dauerhaft kaputt, faellt es hier trotzdem auf, weil die
        # Regel in Grafana rot steht — und weil ohne Daten der Waechter
        # 'Analyzer offline' anschlaegt.
        execErrState: KeepLast
        annotations:
          summary: >-
            {{ if $labels.rulename }}ABFRAGE FEHLGESCHLAGEN in der Regel „{{ $labels.rulename }}" — kein Analyzer ist ausgefallen, Grafana konnte die Datenbank nicht auswerten.{{ else }}Gerät seit über 24 Stunden stumm{{ if $labels.name }} — {{ $labels.name }}{{ end }}{{ end }}
          description: >-
            Von {{ $labels.name }} kam seit mehr als einem Tag kein Telegramm
            mehr — an keinem Standort. Bei batteriebetriebenen Homematic-Geräten
            ist das fast immer eine leere Batterie.
        labels:
          bereich: geraete
        data:
          - refId: A
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: asksin-influx
            model:
              refId: A
              query: |
                from(bucket: "asksin")
                  |> range(start: -1h)
                  |> filter(fn: (r) => r._measurement == "geraet")
                  |> filter(fn: (r) => r._field == "sekundenSeitEmpfang")
                  |> group(columns: ["standort", "name"])
                  |> last()
                  |> group(columns: ["name"])
                  |> min()
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [86400] }

      # ------------------------------------------- 4. Grundrauschen hoch
      #
      # Zum `duplicate` in der Abfrage: mean() ist eine ECHTE Zusammenfassung
      # und laesst die Zeitspalte fallen — anders als last(), max() und min(),
      # die eine Zeile AUSWAEHLEN und deren Zeitstempel behalten. Ohne _time
      # haelt Grafana das Ergebnis fuer keine Zeitreihe, verwirft es
      # ("Ignoring InfluxDB data frame due to missing numeric fields") und die
      # Regel geht in DatasourceError. Am 20.08.2026 am laufenden Geraet
      # nachgewiesen: alle fuenf Minuten drei verworfene Reihen, eine je
      # Standort.
      #
      # ACHTUNG, teuer gelernt: Diese Erklaerung stand einen Tag lang IN der
      # Abfrage — und Flux kennt kein '#'. Die Regel liess sich dadurch gar
      # nicht mehr uebersetzen ("invalid statement: #"), 472-mal in zwanzig
      # Stunden. Aus einem stillen Fehler war ein lauterer geworden.
      # Kommentare zu einer Flux-Abfrage gehoeren hierher, ausserhalb des
      # Blocks; innerhalb ginge nur '//'.
      - uid: asksin-alarm-rauschen
        title: Grundrauschen dauerhaft erhöht
        condition: C
        for: 30m
        noDataState: OK
        # KeepLast statt Error: Eine kurzzeitig gescheiterte Abfrage — etwa
        # waehrend Grafana neu startet — ist kein Grund fuer eine Meldung
        # aufs Telefon. Genau das ist passiert: Nach einem Neustart kamen
        # drei 'DatasourceError' an, obwohl gar nichts los war. Bleibt die
        # Abfrage dauerhaft kaputt, faellt es hier trotzdem auf, weil die
        # Regel in Grafana rot steht — und weil ohne Daten der Waechter
        # 'Analyzer offline' anschlaegt.
        execErrState: KeepLast
        annotations:
          summary: >-
            {{ if $labels.rulename }}ABFRAGE FEHLGESCHLAGEN in der Regel „{{ $labels.rulename }}" — kein Analyzer ist ausgefallen, Grafana konnte die Datenbank nicht auswerten.{{ else }}Grundrauschen erhöht{{ if $labels.standort }} — {{ $labels.standort }}{{ end }}{{ end }}
          description: >-
            Am Standort {{ $labels.standort }} liegt das Grundrauschen seit
            einer halben Stunde über −80 dBm. In dieser Höhe gehen schwache
            Telegramme unter. Häufigste Ursachen sind Schaltnetzteile und
            Ladegeräte in unmittelbarer Nähe der Antenne.
        labels:
          bereich: funk
        data:
          - refId: A
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: asksin-influx
            model:
              refId: A
              query: |
                from(bucket: "asksin")
                  |> range(start: -1h)
                  |> filter(fn: (r) => r._measurement == "analyzer")
                  |> filter(fn: (r) => r._field == "grundrauschen")
                  |> group(columns: ["standort"])
                  |> mean()
                  |> duplicate(column: "_stop", as: "_time")
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [-80] }
