# Haelt den entschluesselten InfluxDB-Token aus dem Systemjournal.
#
# ## Der Befund
#
# Das InfluxDB-Plugin von Grafana protokolliert bei JEDER Abfrage die
# vollstaendigen Datenquellen-Einstellungen — einschliesslich des
# ENTSCHLUESSELTEN Tokens. Bei vier Alarmregeln im Fuenfminutentakt sind das
# rund 1200 Kopien am Tag. Am 20.08.2026 auf Analyzer 01 gezaehlt: 2393
# Vorkommen in 48 Stunden, das Journal reichte zehn Tage zurueck.
#
# Lesbar ist das fuer jeden mit Journalzugriff — und es liegt in jeder
# Sicherung davon.
#
# ## Was NICHT hilft
#
# Grafanas eigene Stellschrauben. Beides ausprobiert und gemessen:
#
#   [log] filters = tsdb.influx_flux:warn …   -> unveraendert 6 je 5 Minuten
#   [log] level = warn                        -> unveraendert 6 je 5 Minuten
#
# Der Grund ist am Format zu sehen: Grafanas eigene Zeilen sehen aus wie
# `logger=… t=…`, diese hier sind reines JSON mit eigenem `@level`. Sie gehen
# ueber die Standardausgabe des Plugins direkt ans Journal und damit an
# Grafanas Protokoll vorbei. Was Grafana nicht schreibt, kann Grafana auch
# nicht filtern.
#
# ## Was hilft
#
# LogFilterPatterns verwirft die Zeilen dort, wo sie ankommen — in systemd.
# Die Tilde macht ein AUSSCHLUSSmuster daraus. Gemessen: von sechs Vorkommen
# je fuenf Minuten auf null, waehrend Grafanas eigene Zeilen und die
# Alarmauswertung unveraendert weiterlaufen. Es faellt genau die Zeilenart
# weg, die das Geheimnis traegt, nicht das ganze Plugin-Protokoll.
#
# Voraussetzung: systemd ab 253 mit PCRE2. Fehlt beides, bleibt die Zeile
# wirkungslos — sie schadet dann nicht, hilft aber auch nicht.
#
# ## Was das NICHT ersetzt
#
# Einen Token, der schon im Journal steht, holt das hier nicht zurueck. Wer
# diese Datei nachtraeglich einspielt, sollte den Token neu erzeugen. Und
# selbst dann bleibt richtig, Grafana nur LESERECHTE zu geben: Es fragt ab,
# es schreibt nicht.
[Service]
LogFilterPatterns=~DecryptedSecureJSONData
